name: release

# Build cross-platform binaries and attach them to the GitHub Release whenever a
# version tag is pushed. The self-updater (`gfit-cli self.update`) downloads the
# asset named `gfit-cli-<target>` that matches the running platform.
#
# Two stages so matrix jobs never race to write the same release: each `build`
# job uploads its binary as a CI artifact, then a single `release` job collects
# them all and publishes the release once.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build/release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # Cross-compiled from the Apple-Silicon runner (universal Apple toolchain)
          # to avoid the scarce/slow Intel macos-13 runner.
          - os: macos-14
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact tag — on workflow_dispatch the default ref is the
          # branch, not the requested tag.
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          {
            echo '[target.aarch64-unknown-linux-gnu]'
            echo 'linker = "aarch64-linux-gnu-gcc"'
          } >> .cargo/config.toml

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage binary + checksum
        shell: bash
        run: |
          bin="gfit-cli-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/gfit-cli" "$bin"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$bin" | awk '{print $1}' > "$bin.sha256"
          else
            shasum -a 256 "$bin" | awk '{print $1}' > "$bin.sha256"
          fi
          ls -l "$bin" "$bin.sha256"
          cat "$bin.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfit-cli-${{ matrix.target }}
          path: |
            gfit-cli-${{ matrix.target }}
            gfit-cli-${{ matrix.target }}.sha256
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lR dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
